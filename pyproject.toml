[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "openqos"
version = "0.1.0"
description = "Hardware-adaptive Fedora-based Linux operating system tooling"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "OpenQOS contributors" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Hardware",
    "Topic :: System :: Installation/Setup",
]
dependencies = []

[project.optional-dependencies]
validation = ["jsonschema>=4.20"]
dev = [
    "jsonschema>=4.20",
    "mypy>=1.11",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.scripts]
openqos = "openqos.cli:entrypoint"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"openqos.schemas" = ["*.json"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "linux_only: tests that can only run on Linux",
]

[tool.coverage.run]
source = ["openqos"]
branch = true

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "S"]
ignore = [
    "S101", # pytest uses assertions
]

[tool.ruff.lint.per-file-ignores]
"src/openqos/hardware/commands.py" = ["S603", "S607"]
"src/openqos/imagebuilder/runner.py" = ["S603", "S607"]
"tests/**" = ["S603", "S607"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["openqos"]
strict = true
warn_unreachable = true
